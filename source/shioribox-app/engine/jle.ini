; JLE options. 1 = on, 0 = off. Keep this file next to jle.exe.
;
; windows: fixes garbled window titles / message boxes / dialog text (ANSI window text APIs).
windows=1
; repair: after-the-fact fix of garbled title/label text (works only if this PC's ANSI code page is a
; single-byte one such as 1252; use windows=1 for UTF-8 systems).
repair=1
; The options below patch the program itself. All off by default.
; Turn ONE on at a time and test the game after each.
dbcs=0
fonts=0
ntdll=0
